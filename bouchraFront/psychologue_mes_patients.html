<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes patients - Psychologue | Nebras</title>
    <link rel="stylesheet" href="./css/psychologue_style.css">
    <link rel="icon" type="image/png" href="./assets/image/logo.png">
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <img src="./assets/image/logo.png" alt="Nebras Logo">
            </div>
            <nav class="nav-menu">
                <a href="psychologue_dashboard.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor" />
                    </svg>
                    <span>Tableau de bord</span>
                </a>
                <a href="psychologue_mes_patients.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
                            fill="currentColor" />
                    </svg>
                    <span>Mes patients</span>
                    <span class="badge">0</span>
                </a>
                <a href="psychologue_emploi_du_temps.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"
                            fill="currentColor" />
                    </svg>
                    <span>Emploi du temps</span>
                </a>
                <a href="psychologue_messagerie.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"
                            fill="currentColor" />
                    </svg>
                    <span>Messagerie</span>
                    <span class="badge">0</span>
                </a>
                <a href="psychologue_honoraires.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.5 15h-3v-2h3v2zm0-4h-3V7h3v6z"
                            fill="currentColor" />
                    </svg>
                    <span>Honoraires</span>
                </a>
                <a href="psychologue_groupes.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
                            fill="currentColor" />
                    </svg>
                    <span>Thérapie de groupe</span>
                </a>
                <a href="psychologue_VIP.html" class="nav-item vip-link" onclick="checkVIPStatus(event)">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15 9 22 9 16 14 19 22 12 17 5 22 8 14 2 9 9 9 12 2" />
                    </svg>
                    <span>Espace VIP</span>
                    <span class="vip-status-badge" id="vipStatusBadge">Non activé</span>
                </a>
                <a href="psychologue_analytics.html" class="nav-item" id="analyticsNavItem">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 20V10M12 20V4M6 20v-6" />
                    </svg>
                    <span>Analytics</span>
                    <span
                        style="background:#c5b4e4;color:white;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:4px;">VIP</span>
                </a>
            </nav>

            <!-- Profile + Settings + Logout -->
            <div class="nav-item profile-link" style="display:flex;align-items:center;gap:8px;cursor:default;">
                <a href="psychologue_profil.html"
                    style="display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;color:inherit;min-width:0;">
                    <div class="user-avatar" id="sidebarAvatar"></div>
                    <div class="user-info" style="min-width:0;overflow:hidden;">
                        <span class="user-name" id="sidebarUserName"
                            style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Dr.</span>
                    </div>
                </a>
                <a href="psychologue_profil.html" title="Paramètres"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(255,255,255,0.1);flex-shrink:0;text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="18" height="18">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.1A10 10 0 0 0 12 18a10 10 0 0 0 6.33-2.2z" />
                    </svg>
                </a>
                <a href="#" onclick="logout()" title="Déconnexion"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(231,76,60,0.15);flex-shrink:0;text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" width="18" height="18">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16,17 21,12 16,7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </a>
            </div>
        </div>

        <div class="main-content">
            <header class="page-header">
                <div>
                    <h1>Mes patients</h1>
                    <p class="subtitle">Gérez vos patients et leurs notes</p>
                </div>
            </header>

            <div class="search-section-advanced">
                <div class="search-main">
                    <div class="search-bar-advanced">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44AA99" stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="text" id="searchInput" placeholder="Rechercher par nom..."
                            onkeyup="filterPatients()">
                    </div>
                    <button class="search-btn" onclick="filterPatients()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        Rechercher
                    </button>
                    <button class="reset-btn" onclick="resetFilters()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        Réinitialiser
                    </button>
                </div>
                <div class="filters-row">
                    <select id="filterMotif" class="filter-select" onchange="filterPatients()">
                        <option value="">Tous les motifs</option>
                        <option value="Anxiété">Anxiété</option>
                        <option value="Stress">Stress</option>
                        <option value="Confiance en soi">Confiance en soi</option>
                        <option value="Dépression">Dépression</option>
                        <option value="Anxiété sociale">Anxiété sociale</option>
                        <option value="Stress post-traumatique">Stress post-traumatique</option>
                    </select>
                    <select id="filterDate" class="filter-select" onchange="filterPatients()">
                        <option value="">Toutes les dates</option>
                        <option value="7">Dernière séance dans les 7 jours</option>
                        <option value="30">Dernière séance dans les 30 jours</option>
                        <option value="90">Dernière séance dans les 90 jours</option>
                    </select>
                </div>
            </div>

            <div class="patients-grid" id="patientsGrid">
            </div>
        </div>
    </div>

    <div id="notesModal" class="notes-modal">
        <div class="notes-modal-content" style="max-width: 600px;">
            <div class="notes-modal-header">
                <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#091346" stroke-width="2">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    </svg> Profil du patient</h2>
                <button class="close-modal" onclick="closeNotesModal()">&times;</button>
            </div>
            <div id="patientProfileContent" class="notes-list">
            </div>
        </div>
    </div>
    <script src="js/guard.js"></script>
    <script src="js/router.js"></script>
    <script src="js/api.js"></script>
    <script src="js/shared/doctor-mes-patients.js"></script>
    <script src="js/psychologue_mes_patients.js" defer></script>
</body>

</html>
