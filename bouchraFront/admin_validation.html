<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validations - Admin | Nebras</title>
    <link rel="stylesheet" href="./css/admin_style.css">
    <link rel="icon" type="image/png" href="./assets/image/logo.png">
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <img src="./assets/image/logo.png" alt="Nebras Logo">
            </div>
            <nav class="nav-menu">
                <a href="admin_dashboard.html" class="nav-item active">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H5a2 2 0 0 1-2-2z" />
                    </svg>
                    <span>Tableau de bord</span>
                </a>
                <a href="admin_utilisateurs.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>Utilisateurs</span>
                    <span class="badge" id="usersBadge"></span>
                </a>
                <a href="admin_validation.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                    <span>Validations</span>
                    <span class="badge" id="validationsBadge"></span>
                </a>
                <a href="admin_paiements.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M16 8l-4 8-4-8" />
                    </svg>
                    <span>Paiements</span>
                    <span class="badge" id="paymentsBadge"></span>
                </a>
                <a href="admin_statistiques.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-3" />
                        <path d="M12 2v12m0 0l-3-3m3 3l3-3" />
                    </svg>
                    <span>Statistiques</span>
                </a>
            </nav>

            <!-- Profile + Settings + Logout -->
            <div class="nav-item profile-link" style="display:flex;align-items:center;gap:8px;cursor:default;">
                <a href="admin.html"
                    style="display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;color:inherit;min-width:0;">
                    <div class="user-avatar">A</div>
                    <div class="user-info" style="min-width:0;overflow:hidden;">
                        <span class="user-name"
                            style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Admin</span>
                    </div>
                </a>
                <a href="admin.html" title="Paramètres"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(255,255,255,0.1);flex-shrink:0;text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="18" height="18">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.1A10 10 0 0 0 12 18a10 10 0 0 0 6.33-2.2z" />
                    </svg>
                </a>
                <a href="#" onclick="logout()" title="Déconnexion"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(231,76,60,0.15);flex-shrink:0;text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" width="18" height="18">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16,17 21,12 16,7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </a>
            </div>
        </div>

        <div class="main-content">
            <header class="page-header">
                <div>
                    <h1>Validations</h1>
                    <p class="subtitle">Approuvez ou refusez les nouvelles inscriptions</p>
                </div>
            </header>

            <div class="validation-tabs">
                <button class="validation-tab active" onclick="showTab('psychologue')">Psychologues</button>
                <button class="validation-tab" onclick="showTab('counselor')">Counselors</button>
            </div>

            <div id="psychologueSection" class="validation-tab-content active">
                <div class="validation-grid" id="psychologueGrid"></div>
            </div>

            <div id="counselorSection" class="validation-tab-content">
                <div class="validation-grid" id="counselorGrid"></div>
            </div>
        </div>
    </div>
    <script src="js/router.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/admin.js"></script>
</body>

</html>
