<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie - Counselor | Nebras</title>
    <link rel="stylesheet" href="./css/counselor_style.css">
    <link rel="stylesheet" href="./css/messaging_common.css">
    <link rel="icon" type="image/png" href="./assets/image/logo.png">
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <img src="./assets/image/logo.png" alt="Nebras Logo">
            </div>
            <nav class="nav-menu">
                <a href="counselor_dashboard.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor" />
                    </svg>
                    <span>Tableau de bord</span>
                </a>
                <a href="counselor_mes_patients.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
                            fill="currentColor" />
                    </svg>
                    <span>Mes patients</span>
                    <span class="badge">0</span>
                </a>
                <a href="counselor_emploi_du_temps.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"
                            fill="currentColor" />
                    </svg>
                    <span>Emploi du temps</span>
                </a>
                <a href="counselor_messagerie.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"
                            fill="currentColor" />
                    </svg>
                    <span>Messagerie</span>
                    <span class="badge">0</span>
                </a>
                <a href="counselor_honoraires.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.5 15h-3v-2h3v2zm0-4h-3V7h3v6z"
                            fill="currentColor" />
                    </svg>
                    <span>Honoraires</span>
                </a>
                <a href="counselor_VIP.html" class="nav-item vip-link" onclick="checkVIPStatus(event)">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15 9 22 9 16 14 19 22 12 17 5 22 8 14 2 9 9 9 12 2" />
                    </svg>
                    <span>Espace VIP</span>
                    <span class="vip-status-badge" id="vipStatusBadge">Non activé</span>
                </a>
                <a href="counselor_analytics.html" class="nav-item" id="analyticsNavItem">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 20V10M12 20V4M6 20v-6" />
                    </svg>
                    <span>Analytics</span>
                    <span
                        style="background:#c5b4e4;color:white;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:4px;">VIP</span>
                </a>
            </nav>

            <!-- Profile + Settings + Logout -->
            <div class="nav-item profile-link" style="display:flex;align-items:center;gap:8px;cursor:default;">
                <a href="counselor_profil.html"
                    style="display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;color:inherit;min-width:0;">
                    <div class="user-avatar" id="sidebarAvatar"></div>
                    <div class="user-info" style="min-width:0;overflow:hidden;">
                        <span class="user-name" id="sidebarUserName"
                            style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Dr.</span>
                    </div>
                </a>
                <a href="counselor_profil.html" title="Paramètres"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(255,255,255,0.1);flex-shrink:0;text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="18" height="18">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.1A10 10 0 0 0 12 18a10 10 0 0 0 6.33-2.2z" />
                    </svg>
                </a>
                <a href="#" onclick="logout()" title="Déconnexion"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(231,76,60,0.15);flex-shrink:0;text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" width="18" height="18">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16,17 21,12 16,7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </a>
            </div>
        </div>
        <!-- Main Content -->
        <div class="main-content">
            <header class="page-header">
                <div>
                    <h1>Messagerie</h1>
                    <p class="breadcrumb">Accueil › Messagerie</p>
                </div>
            </header>

            <div class="messagerie-layout">
                <!-- Liste des conversations - VIDE -->
                <div class="conversations-panel">
                    <div class="conversations-header">
                        <h2>Messages</h2>
                        <div class="header-icons">
                            <button class="icon-btn-msg">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"
                                        fill="currentColor" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="search-bar-msg">
                        <svg class="search-icon-msg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                                fill="currentColor" />
                        </svg>
                        <input type="text" placeholder="Rechercher une conversation...">
                    </div>

                    <div class="conversations-list">
                        <!-- Liste vide -->
                        <div class="empty-conversations">
                            <div class="empty-icon">💬</div>
                            <p>Aucune conversation</p>
                        </div>
                    </div>
                </div>

                <!-- Zone de conversation - VIDE -->
                <div class="conversation-area">
                    <div class="conversation-header" style="display:none;">
                        <div class="conv-header-info">
                            <div class="conv-header-avatar">U</div>
                            <span class="conv-header-name">Utilisateur</span>
                        </div>
                    </div>
                    <div class="chat-messages"></div>
                    <div class="message-input" style="display:none;">
                        <input type="text" placeholder="Tapez votre message..."
                            onkeypress="if(event.key==='Enter')sendMsg()">
                        <button class="send-btn" onclick="sendMsg()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13" />
                                <polygon points="22 2 15 22 11 13 2 9 22 2" />
                            </svg>
                        </button>
                    </div>
                    <div class="empty-conversation">
                        <div class="empty-icon-large">📭</div>
                        <h3>Sélectionnez une conversation</h3>
                        <p>Choisissez un contact pour commencer à discuter</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/router.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/shared/doctor-messagerie.js" defer></script>
    <script src="js/counselor_messagerie.js" defer></script>
</body>

</html>
