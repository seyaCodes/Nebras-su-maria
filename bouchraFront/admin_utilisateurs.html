<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateurs - Admin | Nebras</title>
    <link rel="stylesheet" href="./css/admin_style.css">
    <link rel="icon" type="image/png" href="./assets/image/logo.png">
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <img src="./assets/image/logo.png" alt="Nebras Logo">
            </div>
            <nav class="nav-menu">
                <a href="admin_dashboard.html" class="nav-item active">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H5a2 2 0 0 1-2-2z" />
                    </svg>
                    <span>Tableau de bord</span>
                </a>
                <a href="admin_utilisateurs.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>Utilisateurs</span>
                    <span class="badge" id="usersBadge"></span>
                </a>
                <a href="admin_validation.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                    <span>Validations</span>
                    <span class="badge" id="validationsBadge"></span>
                </a>
                <a href="admin_paiements.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M16 8l-4 8-4-8" />
                    </svg>
                    <span>Paiements</span>
                    <span class="badge" id="paymentsBadge"></span>
                </a>
                <a href="admin_statistiques.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-3" />
                        <path d="M12 2v12m0 0l-3-3m3 3l3-3" />
                    </svg>
                    <span>Statistiques</span>
                </a>
            </nav>

            <!-- Profile + Settings + Logout -->
            <div class="nav-item profile-link" style="display:flex;align-items:center;gap:8px;cursor:default;">
                <a href="admin.html"
                    style="display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;color:inherit;min-width:0;">
                    <div class="user-avatar">A</div>
                    <div class="user-info" style="min-width:0;overflow:hidden;">
                        <span class="user-name"
                            style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Admin</span>
                    </div>
                </a>
                <a href="admin.html" title="Paramètres"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(255,255,255,0.1);flex-shrink:0;text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="18" height="18">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.1A10 10 0 0 0 12 18a10 10 0 0 0 6.33-2.2z" />
                    </svg>
                </a>
                <a href="#" onclick="logout()" title="Déconnexion"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(231,76,60,0.15);flex-shrink:0;text-decoration:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" width="18" height="18">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16,17 21,12 16,7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </a>
            </div>
        </div>

        <div class="main-content">
            <header class="page-header">
                <div>
                    <h1>Gestion des utilisateurs</h1>
                    <p class="subtitle">Gérez tous les utilisateurs de la plateforme</p>
                </div>
            </header>
            <div class="filters-bar">
                <input type="text" id="searchInput" placeholder="Rechercher par nom ou email..." class="filter-input"
                    oninput="debounceSearch()">
                <select class="filter-select" id="typeFilter" onchange="loadUsers()">
                    <option value="">Tous les types</option>
                    <option value="patient">Patients</option>
                    <option value="psychologue">Psychologues</option>
                    <option value="counselor">Counselors</option>
                </select>
                <select class="filter-select" id="statusFilter" onchange="loadUsers()">
                    <option value="">Tous les statuts</option>
                    <option value="active">Actif</option>
                    <option value="pending">En attente</option>
                    <option value="rejected">Rejeté</option>
                    <option value="suspended">Suspendu</option>
                </select>
                <button class="action-btn primary" onclick="loadUsers()"><svg viewBox="0 0 24 24" fill="none"
                        stroke="white" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg> Filtrer</button>
            </div>

            <div class="admin-section">
                <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg> Liste des utilisateurs</h2>
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Photo</th>
                                <th>Nom complet</th>
                                <th>Email</th>
                                <th>Type</th>
                                <th>Statut</th>
                                <th>Inscription</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
                <div id="paginationInfo" style="margin-top:15px;text-align:center;color:#666;font-size:13px;"></div>
            </div>
        </div>
    </div>
    <script src="js/router.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/admin.js"></script>
</body>

</html>
