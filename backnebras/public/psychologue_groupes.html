                <a href="psychologue_messagerie.html" class="nav-item">

                <a href="psychologue_honoraires.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.5 15h-3v-2h3v2zm0-4h-3V7h3v6z"

                    <span>Honoraires</span>

                <a href="psychologue_groupes.html" class="nav-item">

                            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"

            <!-- Profile + Settings + Logout -->
            <div class="nav-item profile-link" style="display:flex;align-items:center;gap:8px;cursor:default;">
                <a href="psychologue_profil.html"
                    style="display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;color:inherit;min-width:0;">
                    <div class="user-avatar" id="sidebarAvatar"></div>
                    <div class="user-info" style="min-width:0;overflow:hidden;">
                        <span class="user-name" id="sidebarUserName"
                            style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Dr.</span>
                    </div>
                </a>
                <a href="psychologue_profil.html" title="Paramètres"
                    style="display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:rgba(255,255,255,0.1);flex-shrink:0;text-decoration:none;">

                            d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.1A10 10 0 0 0 12 18a10 10 0 0 0 6.33-2.2z" />

                </a>
                <a href="#" onclick="logout()" title="Déconnexion"

                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />

        <div class="main-content">
            <header class="page-header">
                <div>
                    <h1>Thérapie de groupe</h1>
                    <p class="subtitle">Créez et gérez vos groupes thérapeutiques</p>
                </div>
                <div class="header-icons">
                    <button class="icon-btn" onclick="openCreateGroupModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18"
                            height="18">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="dashboard-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin-bottom: 0;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20"
                            height="20">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                        Mes groupes
                    </h2>
                    <button class="mobile-add-group-btn" onclick="openCreateGroupModal()"
                        style="display: none; background: #44AA99; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 500; cursor: pointer; align-items: center; gap: 6px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                            height="16">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                        Nouveau
                    </button>
                </div>
                <div id="groupsList" class="groups-list-psycho"></div>
            </div>
        </div>
    </div>

    <!-- MODAL CRÉER UN GROUPE -->
    <div id="createGroupModal" class="vip-modal">
        <div class="vip-modal-content">
            <div class="vip-modal-header">
                <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#091346" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg> Créer un groupe</h2>
                <button class="close-modal" onclick="closeCreateGroupModal()">&times;</button>
            </div>
            <div class="vip-modal-body">
                <div class="form-group"><label>Titre du groupe</label><input type="text" id="groupTitle"
                        class="vip-input" placeholder="Ex: Gestion du stress"></div>
                <div class="form-group"><label>Description</label><textarea id="groupDesc" rows="3" class="vip-input"
                        placeholder="Décrivez le thème et les objectifs du groupe..."></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>Thème</label><select id="groupTheme" class="vip-input">
                            <option value="Stress">Stress</option>
                            <option value="Anxiété">Anxiété</option>
                            <option value="Confiance en soi">Confiance en soi</option>
                            <option value="Couple">Couple</option>
                            <option value="Méditation">Méditation</option>
                            <option value="Art-thérapie">Art-thérapie</option>
                        </select></div>
                    <div class="form-group"><label>Jour</label><select id="groupDay" class="vip-input">
                            <option value="Lundi">Lundi</option>
                            <option value="Mardi">Mardi</option>
                            <option value="Mercredi">Mercredi</option>
                            <option value="Jeudi">Jeudi</option>
                            <option value="Vendredi">Vendredi</option>
                            <option value="Samedi">Samedi</option>
                        </select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Heure</label><input type="time" id="groupTime" class="vip-input"
                            value="19:00"></div>
                    <div class="form-group"><label>Durée</label><select id="groupDuration" class="vip-input">
                            <option value="1h">1 heure</option>
                            <option value="1h30" selected>1h30</option>
                            <option value="2h">2 heures</option>
                        </select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Places max</label><input type="number" id="groupMaxPlaces"
                            class="vip-input" value="8" min="2" max="20"></div>
                    <div class="form-group"><label>Prix par séance</label><input type="number" id="groupPrice"
                            class="vip-input" value="1000" placeholder="DA"></div>
                </div>
                <button class="save-form-btn" onclick="createGroup()">Créer le groupe</button>
            </div>
        </div>
    </div>

    <!-- MODAL DÉTAIL GROUPE -->
    <div id="groupDetailModal" class="vip-modal">
        <div class="vip-modal-content" style="max-width: 700px;">
            <div class="vip-modal-header">
                <h2 id="detailGroupTitle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#091346"
                        stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                    </svg> Détail du groupe</h2>
                <button class="close-modal" onclick="closeGroupDetailModal()">&times;</button>
            </div>
            <div class="vip-modal-body">
                <div class="group-detail-tabs">
                    <button class="group-detail-tab active" onclick="switchGroupTab('waiting')"><svg width="14"
                            height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 6v6l4 2" />
                        </svg> Demandes en attente <span id="waitingCount" class="tab-badge">0</span></button>
                    <button class="group-detail-tab" onclick="switchGroupTab('participants')"><svg width="14"
                            height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg> Participants <span id="participantsCount" class="tab-badge">0</span>/<span
                            id="maxPlacesSpan">8</span></button>
                </div>
                <div id="waitingListPanel" class="group-tab-panel active">
                    <div id="waitingListContainer"></div>
                </div>
                <div id="participantsPanel" class="group-tab-panel">
                    <div id="participantsListContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL MODIFIER GROUPE -->
    <div id="editGroupModal" class="vip-modal">
        <div class="vip-modal-content">
            <div class="vip-modal-header">
                <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#091346" stroke-width="2">
                        <path d="M17 3l4 4-7 7H10v-4l7-7z" />
                        <path d="M3 21h18" />
                    </svg> Modifier le groupe</h2><button class="close-modal"
                    onclick="closeEditGroupModal()">&times;</button>
            </div>
            <div class="vip-modal-body">
                <input type="hidden" id="editGroupId">
                <div class="form-group"><label>Titre</label><input type="text" id="editGroupTitle" class="vip-input">
                </div>
                <div class="form-group"><label>Description</label><textarea id="editGroupDesc" rows="3"
                        class="vip-input"></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>Jour</label><select id="editGroupDay" class="vip-input">
                            <option>Lundi</option>
                            <option>Mardi</option>Mercred<option>Mercredi</option>
                            <option>Jeudi</option>
                            <option>Vendredi</option>
                            <option>Samedi</option>
                        </select></div>
                    <div class="form-group"><label>Heure</label><input type="time" id="editGroupTime" class="vip-input">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Places max</label><input type="number" id="editGroupMaxPlaces"
                            class="vip-input" min="2" max="20"></div>
                    <div class="form-group"><label>Prix</label><input type="number" id="editGroupPrice"
                            class="vip-input"></div>
                </div>
                <button class="save-form-btn" onclick="updateGroup()">Enregistrer</button>
                <button class="delete-group-btn" onclick="deleteGroup()">Supprimer le groupe</button>
            </div>
        </div>
    </div>

    <!-- Patient Profile Modal (used from join requests) -->
    <div id="patientProfileModal" class="notes-modal">
        <div class="notes-modal-content" style="max-width: 600px;" onclick="event.stopPropagation()">
            <div class="notes-modal-header">
                <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#091346" stroke-width="2">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    </svg> Profil du patient</h2>
                <button class="close-modal" onclick="closePatientModal()">&times;</button>
            </div>
            <div id="patientProfileContent" class="notes-list">
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/router.js"></script>
    <script src="js/api.js"></script>
    <script src="js/psychologue_groupes.js"></script>
</body>
